<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김현래 | AX 전문강사 포트폴리오</title>
  <meta name="description" content="김현래의 개인 홈페이지 겸 AX 전문강사 포트폴리오입니다.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/sections.css">
</head>
<body>
  <a href="#main-content" class="skip-link">본문 바로가기</a>

  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a href="#hero" class="logo">김현래</a>

      <nav class="site-nav" aria-label="주요 메뉴">
        <div class="nav-menu" id="nav-menu">
          <ul class="nav-menu__secondary">
            <li><a href="#story" class="nav-link nav-link--secondary">이야기</a></li>
            <li><a href="#explain" class="nav-link nav-link--secondary">설명</a></li>
            <li><a href="#work" class="nav-link nav-link--secondary">프로젝트</a></li>
            <li><a href="#contact" class="nav-link nav-link--secondary">문의</a></li>
          </ul>
          <ul class="nav-menu__primary">
            <li><a href="career.html" class="nav-link">커리어</a></li>
            <li><a href="teaching.html" class="nav-link">강사</a></li>
          </ul>
        </div>
      </nav>

      <div class="header-actions">
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="다크모드 전환" aria-pressed="false">
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
        </button>
        <button type="button" class="icon-btn hamburger-btn" id="hamburger-btn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="nav-menu">
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section id="hero" class="hero-section" aria-labelledby="hero-heading">
      <div class="container hero-inner">
        <h1 id="hero-heading" class="hero-heading" data-mount="hero-heading"></h1>
        <p class="hero-sub" id="hero-sub" data-mount="hero-sub"></p>
      </div>
    </section>

    <section id="story" class="story-section" aria-labelledby="story-heading">
      <div class="container">
        <h2 id="story-heading" class="section-heading">이야기</h2>
        <div class="story-body">
          <div class="story-progress" aria-hidden="true">
            <div class="story-progress-fill" id="story-progress-fill"></div>
          </div>
          <ol class="story-track" id="story-track" data-mount="story"></ol>
        </div>

        <p class="story-outro">
          <a href="career.html" class="story-outro-link">20년을 더 자세히 보기</a>
        </p>
      </div>
    </section>

    <section id="explain" class="explain-section" aria-labelledby="explain-heading">
      <div class="container">
        <h2 id="explain-heading" class="section-heading">이렇게 설명합니다</h2>

        <div class="explain-perspective" data-mount="explain-perspective">
          <figure class="explain-perspective__figure">
            <img class="explain-perspective__image" id="explain-image" data-mount="explain-image" src="" alt="">
            <figcaption class="explain-perspective__caption" id="explain-caption" data-mount="explain-caption"></figcaption>
          </figure>
          <ul class="explain-statements" id="explain-statements" data-mount="explain-statements"></ul>
        </div>

        <div class="card-grid explain-case-grid" id="explain-case-grid" data-mount="explain-cases"></div>
      </div>
    </section>

    <section id="teaching" class="teaching-section" aria-labelledby="teaching-heading">
      <div class="container">
        <h2 id="teaching-heading" class="section-heading">강의 주제</h2>
        <p class="teaching-intro" id="teaching-intro" data-mount="teaching-intro"></p>
        <div class="teaching-groups" id="teaching-groups" data-mount="teaching"></div>
      </div>
    </section>

    <section id="credentials" class="credentials-section" aria-labelledby="credentials-heading">
      <div class="container">
        <h2 id="credentials-heading" class="section-heading">자격·수료</h2>
        <ul class="credentials-list" id="credentials-list" data-mount="credentials"></ul>
      </div>
    </section>

    <section id="work" class="work-section" aria-labelledby="work-heading">
      <div class="container">
        <h2 id="work-heading" class="section-heading">프로젝트</h2>

        <div class="work-filters" id="work-filters" role="group" aria-label="프로젝트 카테고리 필터">
          <button type="button" class="filter-btn is-active" data-filter="all">전체</button>
          <button type="button" class="filter-btn" data-filter="강의 콘텐츠">강의 콘텐츠</button>
          <button type="button" class="filter-btn" data-filter="실무 도구">실무 도구</button>
          <button type="button" class="filter-btn" data-filter="개인 프로젝트">개인 프로젝트</button>
        </div>

        <div class="card-grid work-grid" id="work-grid" data-mount="work" aria-live="polite"></div>
      </div>
    </section>

    <section id="github" class="github-section" aria-labelledby="github-heading">
      <div class="container">
        <h2 id="github-heading" class="section-heading">GitHub 저장소</h2>

        <div class="github-panel" id="github-panel" data-mount="github">
          <div class="github-message" id="github-loading" data-state="loading" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span id="github-loading-text"></span>
          </div>

          <div class="github-message github-message--error" id="github-error" data-state="error" hidden>
            <p id="github-error-text"></p>
            <button type="button" class="btn btn-ghost btn-retry" id="github-retry-btn">다시 시도</button>
          </div>

          <div class="github-message" id="github-empty" data-state="empty" hidden></div>

          <ul class="card-grid github-repo-list" id="github-repo-list" data-state="success" hidden></ul>
        </div>
      </div>
    </section>

    <section id="contact" class="contact-section" aria-labelledby="contact-heading">
      <div class="container">
        <h2 id="contact-heading" class="section-heading">강의 문의</h2>

        <form class="contact-form" id="contact-form" novalidate>
          <div class="form-field">
            <label for="contact-name">이름</label>
            <input type="text" id="contact-name" name="name" autocomplete="name" required>
            <span class="form-error" id="contact-name-error" role="alert"></span>
          </div>

          <div class="form-field">
            <label for="contact-email">이메일</label>
            <input type="email" id="contact-email" name="email" autocomplete="email" required>
            <span class="form-error" id="contact-email-error" role="alert"></span>
          </div>

          <div class="form-field">
            <label for="contact-message">문의 내용</label>
            <textarea id="contact-message" name="message" rows="5" required></textarea>
            <span class="form-error" id="contact-message-error" role="alert"></span>
          </div>

          <button type="submit" class="btn btn-primary" id="contact-submit-btn">문의 보내기</button>

          <p class="form-success" id="contact-success-message" role="status" hidden></p>
        </form>
      </div>
    </section>
  </main>

  <button type="button" class="scroll-top-btn" id="scroll-top-btn" aria-label="맨 위로 이동" hidden>
    <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
  </button>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copyright">&copy; <span id="footer-year"></span> 김현래. All rights reserved.</p>
      <a href="https://github.com/hyun02063185-AX-beginner" class="footer-github-link" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-github" aria-hidden="true"></i>
        <span>GitHub</span>
      </a>
    </div>
  </footer>

  <script type="module" src="js/main.js" defer></script>
</body>
</html>
